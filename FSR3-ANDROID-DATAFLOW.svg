<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#77d7e6"/>
    </marker>
    <style>
      .title { font: 700 30px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #f2f7fb; }
      .sub { font: 400 15px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #9fb3c8; }
      .box { fill: #182636; stroke: #35546d; stroke-width: 2; rx: 14; }
      .box2 { fill: #14202d; stroke: #6b4c5b; stroke-width: 2; rx: 14; }
      .label { font: 700 17px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #f2f7fb; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #b8c8d8; }
      .ok { font: 700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #7ee2a8; }
      .warn { font: 700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #ffd27a; }
      .bad { font: 700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill: #ff8e9d; }
      .flow { stroke: #77d7e6; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .gate { stroke: #ffd27a; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  </defs>

  <rect width="1440" height="820" fill="#0b121a"/>
  <text x="56" y="56" class="title">Dead Space Android：GLES → FSR3 Vulkan → Present</text>
  <text x="56" y="86" class="sub">实线为已验证数据路径；琥珀/红色为生产级 FSR3 仍需补齐的输入。默认关闭 FSR3。</text>

  <rect x="48" y="150" width="190" height="118" class="box"/>
  <text x="68" y="184" class="label">Guest GLES1</text>
  <text x="68" y="214" class="small">Dead Space 1.3.34</text>
  <text x="68" y="238" class="small">native ES 1.1 backend</text>

  <rect x="286" y="150" width="220" height="118" class="box"/>
  <text x="306" y="184" class="label">EAGL drawable</text>
  <text x="306" y="214" class="small">color: RGBA8</text>
  <text x="306" y="238" class="small">guest depth: D24 + S8</text>

  <rect x="554" y="150" width="220" height="118" class="box"/>
  <text x="574" y="184" class="label">GPU color copy</text>
  <text x="574" y="214" class="small">glCopyTexSubImage2D</text>
  <text x="574" y="238" class="small">avoid glReadPixels</text>

  <rect x="822" y="150" width="220" height="118" class="box"/>
  <text x="842" y="184" class="label">AHardwareBuffer</text>
  <text x="842" y="214" class="small">GPU sampled + color output</text>
  <text x="842" y="238" class="small">EGLImage ⇄ Vulkan image</text>

  <rect x="1090" y="150" width="300" height="118" class="box"/>
  <text x="1110" y="184" class="label">FSR3 Vulkan context</text>
  <text x="1110" y="214" class="small">upscaler + optical flow + optional FI</text>
  <text x="1110" y="238" class="small">persistent history in prototype</text>

  <path d="M238 209 H282" class="flow"/>
  <path d="M506 209 H550" class="flow"/>
  <path d="M774 209 H818" class="flow"/>
  <path d="M1042 209 H1086" class="flow"/>

  <rect x="1090" y="330" width="300" height="116" class="box"/>
  <text x="1110" y="364" class="label">FSR3 output AHB</text>
  <text x="1110" y="394" class="small">one or two output buffers</text>
  <text x="1110" y="418" class="small">1080 × 2376 probe output</text>
  <path d="M1240 268 V326" class="flow"/>

  <rect x="822" y="330" width="220" height="116" class="box"/>
  <text x="842" y="364" class="label">EGLImage</text>
  <text x="842" y="394" class="small">shared private ES2 context</text>
  <text x="842" y="418" class="small">glEGLImageTargetTexture2DOES</text>
  <path d="M1086 388 H1046" class="flow"/>

  <rect x="554" y="330" width="220" height="116" class="box"/>
  <text x="574" y="364" class="label">ES2 presenter</text>
  <text x="574" y="394" class="small">full-screen shader quad</text>
  <text x="574" y="418" class="small">rotation / letterbox</text>
  <path d="M818 388 H778" class="flow"/>

  <rect x="286" y="330" width="220" height="116" class="box"/>
  <text x="306" y="364" class="label">SDL EGL surface</text>
  <text x="306" y="394" class="small">eglSwapBuffers</text>
  <text x="306" y="418" class="small">Compositor / display</text>
  <path d="M550 388 H510" class="flow"/>

  <rect x="48" y="330" width="190" height="116" class="box"/>
  <text x="68" y="364" class="label">Display</text>
  <text x="68" y="394" class="small">native 60 Hz target</text>
  <text x="68" y="418" class="small">VRR未验证</text>
  <path d="M282 388 H242" class="flow"/>

  <text x="48" y="503" class="label">FSR3 输入审计</text>

  <rect x="48" y="520" width="250" height="96" class="box"/>
  <text x="68" y="551" class="ok">✓ Final color</text>
  <text x="68" y="576" class="small">live game frame verified</text>
  <text x="68" y="598" class="small">zero CPU color readback</text>

  <rect x="322" y="520" width="250" height="96" class="box"/>
  <text x="342" y="551" class="warn">△ Depth</text>
  <text x="342" y="576" class="small">D24 exists</text>
  <text x="342" y="598" class="small">prototype uses blocking CPU readback</text>

  <rect x="596" y="520" width="250" height="96" class="box2"/>
  <text x="616" y="551" class="bad">× Motion vectors</text>
  <text x="616" y="576" class="small">no per-pixel velocity buffer</text>
  <text x="616" y="598" class="small">synthetic 0 / 4 px only</text>

  <rect x="870" y="520" width="250" height="96" class="box2"/>
  <text x="890" y="551" class="bad">× Camera jitter</text>
  <text x="890" y="576" class="small">no Halton jitter injection</text>
  <text x="890" y="598" class="small">matrix tracking not a contract</text>

  <rect x="1144" y="520" width="246" height="96" class="box2"/>
  <text x="1164" y="551" class="bad">× HUD / reactive mask</text>
  <text x="1164" y="576" class="small">HUD in same color frame</text>
  <text x="1164" y="598" class="small">subtitle/QTE ghosting risk</text>

  <rect x="48" y="674" width="1342" height="94" fill="#161b20" stroke="#4e5964" rx="14"/>
  <text x="72" y="708" class="label">发布判定</text>
  <text x="72" y="738" class="warn">FSR3 时间超分：有条件可交付</text>
  <text x="470" y="738" class="bad">FSR3 帧生成：不可交付</text>
  <text x="850" y="738" class="small">证据设备：Adreno 740 / Android 15；其它 GPU、功耗、温度、VRR 未覆盖</text>
</svg>
