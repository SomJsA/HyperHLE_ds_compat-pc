import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

apply plugin: 'com.android.application'
apply plugin: "com.github.willir.rust.cargo-ndk-android"
apply plugin: 'org.jetbrains.kotlin.android'

// arm64-v8a is the shipping target. x86_64 is an opt-in diagnostic build for
// Android emulator/GLES validation and never changes the default artifact.
def touchHleAndroidAbi = project.findProperty('touchHleAndroidAbi') ?: 'arm64-v8a'
def touchHleTargetSdk = (project.findProperty('touchHleTargetSdk') ?: '24').toString().toInteger()
def touchHleFastPresent = (project.findProperty('touchHleFastPresent') ?: 'false').toBoolean()
def touchHleScaleHack = (project.findProperty('touchHleScaleHack') ?: '2').toString().toInteger()
def explicitApplicationIdSuffix =
        (project.findProperty('touchHleApplicationIdSuffix') ?: '').toString()
if (explicitApplicationIdSuffix && !explicitApplicationIdSuffix.startsWith('.')) {
    explicitApplicationIdSuffix = '.' + explicitApplicationIdSuffix
}
def touchHleCargoTarget = [
        'arm64-v8a': 'arm64',
        'x86_64'   : 'x86_64',
][touchHleAndroidAbi]
if (touchHleCargoTarget == null) {
    throw new GradleException("Unsupported touchHleAndroidAbi=${touchHleAndroidAbi}; expected arm64-v8a or x86_64")
}

static def runTouchHLEVersionTool(boolean wantBranding) {
    return ('cargo run --package touchHLE_version' + (wantBranding ? ' -- --branding' : '')).execute().text.trim()
}

static def getTouchHLEBranding() {
    return runTouchHLEVersionTool(/* wantBranding: */ true)
}

static def getTouchHLEVersionName() {
    return runTouchHLEVersionTool(/* wantBranding: */ false)
}

static def join(String prefix, String separator, String branding) {
    if (branding.isEmpty()) {
        return prefix
    } else {
        return prefix + separator + branding
    }
}

android {
    ndkVersion "25.2.9519653"
    compileSdkVersion 35
    androidResources {
        // The IPA is already an archive. Recompressing 500+ MB adds build and
        // first-launch overhead without a meaningful size win.
        noCompress 'ipa'
    }
    packagingOptions {
        // Cargo-ndk keeps prior ABI outputs in the build tree. Exclude the
        // non-target ABI so an arm64 delivery cannot accidentally contain
        // stale x86_64 libraries (and vice versa for diagnostics).
        if (touchHleAndroidAbi == 'arm64-v8a') {
            exclude 'lib/x86_64/**'
        } else {
            exclude 'lib/arm64-v8a/**'
        }
    }
    defaultConfig {
        def branding = getTouchHLEBranding()
        def brandingSuffix = branding.isEmpty() ? '' : branding.toLowerCase()
        applicationId 'org.touchhle.android'
        // Diagnostic builds can install side-by-side with a test save. The
        // default remains empty so release/normal debug artifacts are unchanged.
        def resolvedApplicationIdSuffix = brandingSuffix + explicitApplicationIdSuffix
        applicationIdSuffix(resolvedApplicationIdSuffix.isEmpty() ? null : resolvedApplicationIdSuffix)
        resValue 'string', 'app_name', '死亡空间IOS移植版'
        buildConfigField 'String', 'APP_NAME', '"死亡空间IOS移植版"'
        buildConfigField 'boolean', 'FAST_PRESENT', touchHleFastPresent.toString()
        buildConfigField 'int', 'SCALE_HACK', touchHleScaleHack.toString()
        manifestPlaceholders = [
                icon: join('@drawable/icon', '_', branding.toLowerCase())
        ]
        buildConfigField 'int', 'APP_ICON', join('R.drawable.icon', '_', branding.toLowerCase())
        versionName join(getTouchHLEVersionName(), ' ', branding)

        minSdkVersion 21 // first version with AArch64
        // Keep the runtime contract as old as practical. compileSdk stays at
        // 35 for the modern NDK/AGP toolchain, but targetSdk 24 lets legacy
        // storage/window behavior remain available and is still accepted by
        // current Android releases.
        targetSdkVersion touchHleTargetSdk
    }
    // The target JVM version must be the same for Java and Kotlin.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable true // allow use of ADB to manage files, etc
        }
        debug {
            minifyEnabled false
            packagingOptions {
                doNotStrip '**/*.so'
            }
            debuggable true
            jniDebuggable true
        }
    }


    lintOptions {
        abortOnError false
    }
    namespace 'org.touchhle.android'
}

cargoNdk {
    // Make sure this matches the android abiFilters above.
    targets = [touchHleCargoTarget]
    module = ".."
    librariesNames = ["libtouchHLE.so", "libSDL2.so", "libc++_shared.so"]
    extraCargoEnv = ["ANDROID_NDK": android.ndkDirectory, "ANDROID_NDK_HOME": android.ndkDirectory]
    if (DefaultNativePlatform.host().operatingSystem.isWindows()) {
        def binPath = android.ndkDirectory.toPath().resolve("toolchains/llvm/prebuilt/windows-x86_64/bin")
        def clangPath = binPath.resolve("clang.exe")
        def clangXXPath = binPath.resolve("clang++.exe")

        if (!clangPath.toFile().exists()) {
            throw new GradleException("NDK clang compiler not found at expected location: $clangPath")
        }
        if (!clangXXPath.toFile().exists()) {
            throw new GradleException("NDK clang++ compiler not found at expected location: $clangXXPath")
        }

        extraCargoEnv.putAll([
                "CC"             : clangPath.toString(),
                "CXX"            : clangXXPath.toString(),
                // The default generator on Windows (Visual Studio) does not respect
                // the CC and CXX environment variables. Using Ninja ensures that
                // the specified compilers are used
                "CMAKE_GENERATOR": "Ninja"
        ])
    }
    // The default feature, "static", makes us use static linking for SDL2 and OpenAL Soft.
    // For Android, we need dynamic linking for SDL2, but static linking for OpenAL Soft.
    // libxml2 is also statically linked from the vendored source because Android has no system libxml2.
    extraCargoBuildArguments = ["--lib", "--no-default-features", "--features", "touchHLE_openal_soft_wrapper/static,touchHLE_libxml2_wrapper/static,sdl2/bundled"]
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
