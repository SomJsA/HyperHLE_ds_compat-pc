<main><aside><fieldset><legend>投影方式</legend><nav id="variants"><button data-v="scan" aria-pressed="false">扫描展开 <small>任务默认</small></button><button data-v="segmented" aria-pressed="true">分段投影 <small>章节默认</small></button><button data-v="minimal" aria-pressed="false">简洁浮屏 <small>03</small></button></nav></fieldset><fieldset><legend>显示内容</legend><div class="modes"><button data-mode="chapter" aria-pressed="true">章节</button><button data-mode="objective" aria-pressed="false">任务追踪</button></div><label class="toggle" for="chapter">章节预览</label><select id="chapter"></select></fieldset><fieldset><legend>开关</legend><label class="toggle">投影背景<input type="checkbox" id="panel" checked></label><label class="toggle">入场动画<input type="checkbox" id="motion" checked></label><label class="toggle">干扰字幕<input type="checkbox" id="signal" checked></label><label class="toggle">循环播放<input type="checkbox" id="loop" checked></label><p class="hint">干扰：正常 → 抖动 → 乱码 → 恢复 → 短暂消失 → 恢复 → 重影。</p></fieldset><fieldset><legend>播放速度</legend><div class="speed"><button data-speed=".25">¼×</button><button data-speed=".5">½×</button><button data-speed="1" aria-pressed="true">1×</button></div></fieldset></aside>
<section class="right"><div class="stage" data-variant="segmented" data-mode="chapter" id="stage"><span class="coords">RIG / LOCAL DISPLAY</span><div class="projector" id="projector"><div class="glass"></div><div class="content"><div class="chapter"><div class="ordinal"><span>第</span><b id="number">1</b><span>章</span></div><div class="cn" id="cn"></div><div class="en" id="en"></div></div><div class="task"><small>OBJECTIVE UPDATED</small><div class="rule"></div><h2>进入服务器房间 01</h2><p>循着定位器前进</p></div></div></div><div class="subtitle" id="subtitle"></div><div class="phase" id="phase"></div></div><div class="timeline"><button id="play">暂停</button><button id="replay">重播</button><input type="range" min="0" max="4800" step="10" value="0" aria-label="动画时间" id="time"><output id="timeLabel">0.00 s</output></div><div class="description" id="description"></div><div class="footer"><span>Russell Square / 狮尾快剪黑 · 首字红色加粗</span><span><a href="RIG-long-subtitle-preview.html" style="color:#9fd6e2">长句字幕显示对比 →</a></span></div></section></main>
<script>
const chapters=[{"id": "CHAPTER_01_GAME_TITLE", "text": "当初善意", "english": "Honorable Intentions"}, {"id": "CHAPTER_02_GAME_TITLE", "text": "心伤难逃", "english": "Exit Wounds"}, {"id": "CHAPTER_03_GAME_TITLE", "text": "同流合污", "english": "Willing Accomplice"}, {"id": "CHAPTER_04_GAME_TITLE", "text": "伴我何人", "english": "Identity Crisis"}, {"id": "CHAPTER_05_GAME_TITLE", "text": "切割留痕", "english": "Leaving Traces"}, {"id": "CHAPTER_06_GAME_TITLE", "text": "莫近巨兽", "english": "Lumbering Beast"}, {"id": "CHAPTER_07_GAME_TITLE", "text": "轻跃虚空", "english": "Bounds and Leaps"}, {"id": "CHAPTER_08_GAME_TITLE", "text": "信仰侵蚀", "english": "Encroachment"}, {"id": "CHAPTER_09_GAME_TITLE", "text": "谨慎换装", "english": "Trading Up"}, {"id": "CHAPTER_10_GAME_TITLE", "text": "防不胜防", "english": "Reversal"}, {"id": "CHAPTER_11_GAME_TITLE", "text": "背离理智", "english": "Acute Psychosis"}, {"id": "CHAPTER_12_GAME_TITLE", "text": "叛徒遗祸", "english": "Yesterday's Problem"}], $=id=>document.getElementById(id), stage=$('stage'),panel=$('projector');let t=0,last=0,playing=true,speed=1,variant='segmented';const selectedVariants={chapter:'segmented',objective:'scan'};
const descriptions={scan:'<strong>任务默认 · 扫描展开</strong>　面板从中间接通，细扫描线扫过，再显示文字。短促、克制，保留 RIG 投影的层次。',segmented:'<strong>章节默认 · 分段投影</strong>　分段光栅逐层稳定，面板略带透视。机械感更明显，出场稍有跳帧。',minimal:'<strong>简洁浮屏</strong>　薄底板先淡入，文字跟进。动效最轻，适合频繁出现的任务追踪。'};
const original='通讯链路（干扰）你能听到我吗？保持警惕。',clean=original.replace('（干扰）',' ▒▒ '),clamp=v=>Math.max(0,Math.min(1,v));
function text(el,s){el.replaceChildren();[...s].forEach((c,i,all)=>{const a=document.createElement('span');a.style.display='inline-block';if(i<all.length-1)a.style.marginRight='.1em';if(i===0)a.className='first';a.textContent=c===' '?' ':c;el.append(a)})}
function fitTitles(){const ctx=document.createElement('canvas').getContext('2d');for(const [id,font,field,max]of [['cn','ChapterCN','text',.078],['en','Russell','english',.0425]]){const el=$(id),width=el.clientWidth;let lo=1,hi=stage.clientWidth*max;for(let j=0;j<18;j++){const size=(lo+hi)/2;ctx.font=`${size}px ${font}`;const ok=chapters.every(c=>ctx.measureText(c[field]).width+([...c[field]].length-1)*size*.1+Math.max(1,size*.025)<=width);if(ok)lo=size;else hi=size}el.style.fontSize=lo+'px'}}
new ResizeObserver(fitTitles).observe(stage);document.fonts.ready.then(fitTitles);
chapters.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`第 ${i+1} 章 · ${c.text}`;$('chapter').append(o)});
function chapter(){const i=+$('chapter').value;text($('cn'),chapters[i].text);text($('en'),chapters[i].english);$('number').textContent=i+1;fitTitles();restart()}
function restart(){t=0;playing=true;$('play').textContent='暂停';draw()}
function draw(){let a=$('motion').checked?t:1000;let end=t>3950?clamp((4800-t)/650):1;let open=variant==='scan'?clamp(a/210):variant==='segmented'?Math.ceil(clamp(a/270)*5)/5:clamp(a/190);let reveal=clamp((a-(variant==='minimal'?130:220))/160);panel.style.setProperty('--open',open);panel.style.setProperty('--panel',clamp(a/90)*end);panel.style.setProperty('--text',reveal*end);panel.style.setProperty('--scan',`${clamp(a/460)*100}%`);panel.style.setProperty('--sweep',a<460?'.7':'0');panel.style.setProperty('--flicker',variant==='segmented'&&a<340&&Math.floor(a/55)%2?'.55':'1');stage.classList.toggle('no-panel',!$('panel').checked);
let p=Math.floor(t/80)%32,phase='正常',s=clean,dx=0,opacity=1;const on=$('signal').checked;$('subtitle').classList.toggle('ghost',on&&p>=29);if(on){if(p>=12&&p<=14){phase='抖动';dx=p%2?-2:2}else if(p>=15&&p<=17){phase='乱码';s=[...clean].map((c,i)=>/\s/.test(c)?c:'▧□◇▒'[(i+p)%4]).join('')}else if(p===24){phase='短暂消失';opacity=0}else if(p>=29){phase='偏移重影'}else if(p>=18){phase='恢复'}}$('subtitle').textContent=on?s:clean;$('subtitle').style.transform=`translateX(${dx}px)`;$('subtitle').style.opacity=opacity;$('phase').textContent=`${t<220?'背景接通':t<380?'文字接入':'投影稳定'} / ${on?phase:'干扰关闭'}`;$('time').value=t;$('timeLabel').textContent=(t/1000).toFixed(2)+' s';$('description').innerHTML=descriptions[variant];}
function setVariant(v){variant=v;stage.dataset.variant=v;document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{selectedVariants[stage.dataset.mode]=b.dataset.v;setVariant(b.dataset.v);restart()});document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{stage.dataset.mode=b.dataset.mode;setVariant(selectedVariants[b.dataset.mode]);document.querySelectorAll('button[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));fitTitles();restart()});document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',x===b))});$('chapter').onchange=chapter;$('replay').onclick=restart;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('time').oninput=()=>{playing=false;t=+$('time').value;$('play').textContent='播放';draw()};['panel','motion','signal'].forEach(id=>$(id).onchange=()=>draw());if(matchMedia('(prefers-reduced-motion:reduce)').matches){$('motion').checked=false;$('signal').checked=false;$('loop').checked=false;}
chapter();function frame(now){if(last&&playing){t+=(now-last)*speed;if(t>4800){if($('loop').checked)t=0;else{t=4800;playing=false;$('play').textContent='播放'}}draw()}last=now;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
