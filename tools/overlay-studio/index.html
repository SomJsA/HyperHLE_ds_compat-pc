<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图文层工作台 · Dead Space</title><link rel="stylesheet" href="studio.css"></head><body>
<header><div><div class="eyebrow">DEAD SPACE / DISPLAY LAB</div><h1>图文层工作台</h1></div><nav><span id="connection" class="muted">本地模式</span><button id="capture">截取平板</button><button id="importImage">导入截图</button><button id="importConfig">导入配置</button><button id="exportConfig">导出配置</button><select id="target" aria-label="应用目标"><option value="android">应用到平板</option><option value="pc">应用到 PC</option><option value="both">应用到双端</option></select><button id="apply" class="primary">应用</button></nav></header>
<main><aside class="left"><h2>图层</h2><div id="layers"></div><div class="section"><h2>参考画面</h2><select id="background" aria-label="参考画面"><option value="assets/corridor.jpg">走廊 · 角色站稳</option><option value="assets/deck.jpg">室外甲板 · 明亮背景</option></select><div class="row" style="margin-top:8px"><button id="rotateL" title="向左旋转截图">↶ 90°</button><button id="rotateR" title="向右旋转截图">↷ 90°</button></div><p class="muted note">背景是过场后的真实游玩截图。只作构图参考，历史截图的色彩不代表当前版本。</p></div><div class="section"><h2>编辑范围</h2><button id="scopeGlobal" class="scope active">全局默认</button><button id="scopeEntry" class="scope">单条特调 <span id="overrideCount">0</span></button><p id="scopeHint" class="muted note">调整当前图层的默认样式。</p></div><div class="section"><h2>历史记录</h2><div class="row"><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button></div><button id="reset" class="wide" style="margin-top:8px">恢复当前图层默认</button></div></aside>
<section class="workspace"><div class="toolbar"><div><button id="toggleSidebars">收起侧栏</button><label class="inline"><input id="guides" type="checkbox" checked> 参考线</label><label class="inline"><input id="allLayers" type="checkbox"> 同时预览三层</label></div><span id="dimensions" class="muted"></span></div><div class="canvas-area" id="dropZone"><canvas id="canvas" width="1920" height="1200" aria-label="真实游戏截图与图文层合成预览"></canvas></div><div class="caption"><span id="selectionInfo">拖动图文层调整位置；方向键微调，Shift 加大步长。</span><button id="exportPng">导出合成 PNG</button></div><div id="notice" role="status">正在载入字体与配置…</div></section>
<aside class="right"><div class="row"><h2 id="layerTitle">章节标题</h2><span id="scopeBadge" class="badge">全局默认</span></div><label for="entrySearch">文本 ID / 原文检索</label><input id="entrySearch" placeholder="搜索 Van_47、OBJ_GOV、中文…"><select id="entryId" aria-label="选中游戏文本 ID"></select><div id="entryStatus" class="muted note"></div><label for="primaryText">主文案</label><textarea id="primaryText" rows="3"></textarea><label for="secondaryText" id="secondaryLabel">英文 / 第二行</label><textarea id="secondaryText" rows="2"></textarea><button id="saveEntry" class="wide">保存当前文案为单条覆盖</button><div class="section"><h2>位置与排版</h2><div id="controls"></div></div><div class="section"><h2>颜色与底板</h2><div id="colors"></div></div><button id="clearEntry" class="wide">清除当前条目覆盖</button><p class="muted note">全局文案只供预览；只有“单条覆盖”文案会进入游戏。换行与字形以实机为准。</p></aside></main>
<footer><span id="saveState">配置自动保存在此浏览器</span><span>480 × 320 参考坐标 · 本地处理</span></footer><input id="imageFile" type="file" accept="image/*" hidden><input id="configFile" type="file" accept=".json,application/json" hidden><script type="module" src="studio.mjs"></script></body></html>
